name: renty-backend
region: lon1

services:
  - name: renty-api
    github:
      repo: your-github-username/renty
      branch: main
      deploy_on_push: true
    source_dir: Client/API
    dockerfile_path: Dockerfile
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 8080
    envs:
      - key: ConnectionStrings__DefaultConnection
        scope: RUN_TIME
        value: ${renty-db.DATABASE_URL}
      - key: CLOUDINARY_URL
        scope: RUN_TIME
        value: "cloudinary://api_key:api_secret@cloud_name"
      - key: CORS_ALLOWED_ORIGINS
        scope: RUN_TIME
        value: "https://renty-web.vercel.app,https://renty-admin.vercel.app,https://renty-expert.vercel.app,https://renty-support.vercel.app,https://renty-superadmin.vercel.app"
      - key: JWT_SECRET
        scope: RUN_TIME
        value: "generate_a_long_secure_random_string_here"

databases:
  - name: renty-db
    engine: PG
    version: "15"
    size: db-s-dev-database
