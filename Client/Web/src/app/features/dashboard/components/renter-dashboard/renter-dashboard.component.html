<div class="renter-dashboard">
  <h1 class="dashboard-title">Renter Dashboard</h1>

  @if (loading()) {
  <div class="stats-grid">
    @for (i of [1,2,3]; track i) {
    <p-card>
      <p-skeleton width="100%" height="80px" />
    </p-card>
    }
  </div>
  } @else if (dashboardData()) {
  <div class="stats-grid">
    <p-card class="stat-card">
      <div class="stat-content">
        <i class="pi pi-dollar stat-icon"></i>
        <div class="stat-details">
          <span class="stat-label">Total Spent</span>
          <span class="stat-value">\${{ dashboardData()!.totalSpent | number:'1.2-2' }}</span>
        </div>
      </div>
    </p-card>

    <p-card class="stat-card">
      <div class="stat-content">
        <i class="pi pi-shopping-cart stat-icon"></i>
        <div class="stat-details">
          <span class="stat-label">Total Rentals</span>
          <!-- <span class="stat-value">{{ dashboardData()!.rentalsCount || '' }}</span> -->
        </div>
      </div>
    </p-card>

    <p-card class="stat-card">
      <div class="stat-content">
        <i class="pi pi-check-circle stat-icon"></i>
        <div class="stat-details">
          <span class="stat-label">Active Rentals</span>
          <span class="stat-value">{{ dashboardData()!.activeRentals }}</span>
        </div>
      </div>
    </p-card>
  </div>
  }
</div>
