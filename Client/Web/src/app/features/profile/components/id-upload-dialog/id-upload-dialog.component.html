<div class="id-upload-dialog-container">
  <div class="dialog-header">
    <h2 mat-dialog-title>
      <mat-icon class="header-icon">fingerprint</mat-icon>
      {{ 'profile.uploadIdTitle' | translate }}
    </h2>
    <p class="dialog-description">{{ 'profile.uploadIdDesc' | translate }}</p>
  </div>

  <mat-dialog-content class="custom-dialog-content">
    <div class="upload-grid">
      <div class="upload-card">
        <label class="card-label">{{ 'profile.frontSide' | translate }}</label>
        
        @if (frontImage) {
          <div class="preview-wrapper fade-in">
            <img [src]="frontImage" alt="Front ID">
            <div class="preview-overlay">
              <button type="button" class="action-btn delete-btn" (click)="removeFront()" title="Remove file">
                <mat-icon>delete_outline</mat-icon>
              </button>
            </div>
          </div>
        } @else {
          <label class="drop-zone">
            <input type="file" accept="image/*" (change)="onFrontSelected($event)" hidden>
            <div class="drop-zone-content">
              <div class="icon-circle">
                <mat-icon>add_a_photo</mat-icon>
              </div>
              <span class="upload-title">{{ 'profile.chooseFile' | translate }}</span>
              <span class="upload-subtitle">Supports JPG, PNG up to 5MB</span>
            </div>
          </label>
        }
      </div>

      <div class="upload-card">
        <label class="card-label">{{ 'profile.backSide' | translate }}</label>
        
        @if (backImage) {
          <div class="preview-wrapper fade-in">
            <img [src]="backImage" alt="Back ID">
            <div class="preview-overlay">
              <button type="button" class="action-btn delete-btn" (click)="removeBack()" title="Remove file">
                <mat-icon>delete_outline</mat-icon>
              </button>
            </div>
          </div>
        } @else {
          <label class="drop-zone">
            <input type="file" accept="image/*" (change)="onBackSelected($event)" hidden>
            <div class="drop-zone-content">
              <div class="icon-circle">
                <mat-icon>add_a_photo</mat-icon>
              </div>
              <span class="upload-title">{{ 'profile.chooseFile' | translate }}</span>
              <span class="upload-subtitle">Supports JPG, PNG up to 5MB</span>
            </div>
          </label>
        }
      </div>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="custom-dialog-actions">
    <button type="button" mat-button class="cancel-btn" (click)="cancel()" [disabled]="isUploading">
      {{ 'common.cancel' | translate }}
    </button>
    <button type="button" mat-flat-button color="primary" class="submit-btn" (click)="upload()" [disabled]="isUploading || !frontImage || !backImage">
      @if (isUploading) {
        <mat-progress-spinner diameter="20" mode="indeterminate" class="btn-spinner"></mat-progress-spinner>
        <span>{{ 'profile.uploading' | translate }}</span>
      } @else {
        <ng-container>
          <mat-icon>cloud_upload</mat-icon>
          <span>{{ 'profile.upload' | translate }}</span>
        </ng-container>
      }
    </button>
  </mat-dialog-actions>
</div>
