<div class="page-container">
  <app-header-section [title]="(isEditMode ? 'products.edit' : 'products.new') | translate"
    [showButton]="false" [showSearch]="false" icon="inventory_2" />

  @if (isLoading()) {
  <div class="loading-overlay">
    <div class="spinner"></div>
  </div>
  }

  <form [formGroup]="form" class="grid editor-grid">
    <div class="col-12 lg:col-8 column">
      <div class="card mb-4 shadow-1 p-4 border-round bg-white">
        <h3 class="text-xl font-bold mb-4 border-bottom-1 border-100 pb-3">{{ 'products.general' | translate }}</h3>
        <div class="field-group">
          <app-input label="nameEn" [formGroup]="form" controlName="titleEn" [required]="true" placeholder="placeholders.name" />
          <app-input label="nameAr" [formGroup]="form" controlName="titleAr" [required]="true" placeholder="placeholders.name" />
          <app-input label="descEn" [formGroup]="form" controlName="descEn" type="textarea" [height]="120" placeholder="placeholders.description" />
          <app-input label="descAr" [formGroup]="form" controlName="descAr" type="textarea" [height]="120" placeholder="placeholders.description" />
        </div>
      </div>

      <div class="card mb-4 shadow-1 p-4 border-round bg-white">
        <h3 class="text-xl font-bold mb-4 border-bottom-1 border-100 pb-3">{{ 'products.pricing' | translate }}</h3>
        <div class="field-row">
          <app-input label="dailyPrice" [formGroup]="form" controlName="dailyPrice" type="number" [required]="true" />
          <app-input label="deposit" [formGroup]="form" controlName="defaultDeposit" type="number" [required]="true" />
        </div>
        <div class="field-row">
          <app-input label="weeklyPrice" [formGroup]="form" controlName="weeklyPrice" type="number" />
          <app-input label="monthlyPrice" [formGroup]="form" controlName="monthlyPrice" type="number" />
        </div>
      </div>

      <div class="card mb-4 shadow-1 p-4 border-round bg-white">
        <h3 class="text-xl font-bold mb-4 border-bottom-1 border-100 pb-3">{{ 'products.details' | translate }}</h3>
        <div class="field-row">
          <app-input label="type" [formGroup]="form" controlName="type" type="select" [options]="typeOptions" [translateOptions]="true" />
          <app-input label="condition" [formGroup]="form" controlName="condition" type="select" [options]="conditionOptions" [translateOptions]="true" />
        </div>
        <div class="field-row">
          <app-input label="city" [formGroup]="form" controlName="city" type="select" [options]="governorateOptions" [translateOptions]="true" />
          <app-input label="location" [formGroup]="form" controlName="location" placeholder="placeholders.location" />
        </div>
        <div class="field-group mt-3">
          <label class="field-label">{{ 'labels.mapLocation' | translate }}</label>
          <app-map [formGroup]="form" latitudeControlName="lat" longitudeControlName="lng" [height]="300" [showActions]="true" />
        </div>
      </div>
    </div>

    <div class="col-12 lg:col-4 column">
      <div class="card mb-4 shadow-1 p-4 border-round bg-white">
        <h3 class="text-xl font-bold mb-4 border-bottom-1 border-100 pb-3">{{ 'products.media' | translate }}</h3>
        <app-multi-image-uploader [images]="uploadedImages" (imagesChange)="uploadedImages = $event"/>
      </div>

      <div class="card mb-4 shadow-1 p-4 border-round bg-white">
        <h3 class="text-xl font-bold mb-4 border-bottom-1 border-100 pb-3">{{ 'products.organization' | translate }}</h3>
        <app-input label="category" [formGroup]="form" controlName="categoryId" type="select" [options]="categories()" [required]="true" placeholder="placeholders.category" />
        <app-input class="m-2" label="subcategory" [formGroup]="form" controlName="subcategoryId" type="select" [options]="subcategories()" [required]="true" placeholder="placeholders.subcategory" />
        <app-input label="brand" [formGroup]="form" controlName="brandId" type="select" [options]="brands()" [required]="true" placeholder="placeholders.brand" />
      </div>
    </div>
  </form>

  <div class="flex gap-3 justify-content-end pt-3">
    <app-loading-button variant="stroked" (clicked)="cancel()" type="button">{{ 'buttons.cancel' | translate }}</app-loading-button>
    <app-loading-button color="primary" (clicked)="onSubmit()" [loading]="isSaving()" [disabled]="form.invalid">{{ 'buttons.save' | translate }}</app-loading-button>
  </div>
</div>
