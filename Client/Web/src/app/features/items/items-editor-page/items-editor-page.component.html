<div class="page-container">
  <app-header-section [title]="(isEditMode ? 'products.edit' : 'products.new') | translate"
    [showButton]="false" [showSearch]="false" icon="inventory_2" />

  @if (isLoading) {
  <div class="loading-overlay">
    <div class="spinner"></div>
  </div>
  }

  <form [formGroup]="form" class="editor-grid">
    <div class="column">
      <!-- Basic Info -->
      <div class="card">
        <h3>{{ 'products.general' | translate }}</h3>
        <div class="field-group">
          <app-input label="labels.nameEn" [formGroup]="form" controlName="titleEn" [required]="true" placeholder="placeholders.name" />
          <app-input label="labels.nameAr" [formGroup]="form" controlName="titleAr" [required]="true" placeholder="placeholders.name" />
          <app-input label="labels.descEn" [formGroup]="form" controlName="descEn" type="textarea" [height]="120" placeholder="placeholders.description" />
          <app-input label="labels.descAr" [formGroup]="form" controlName="descAr" type="textarea" [height]="120" placeholder="placeholders.description" />
        </div>
      </div>

      <!-- Pricing -->
      <div class="card">
        <h3>{{ 'products.pricing' | translate }}</h3>
        <div class="field-row">
          <app-input label="labels.dailyPrice" [formGroup]="form" controlName="dailyPrice" type="number" [required]="true" />
          <app-input label="labels.deposit" [formGroup]="form" controlName="defaultDeposit" type="number" [required]="true" />
        </div>
        <div class="field-row">
          <app-input label="labels.weeklyPrice" [formGroup]="form" controlName="weeklyPrice" type="number" />
          <app-input label="labels.monthlyPrice" [formGroup]="form" controlName="monthlyPrice" type="number" />
        </div>
      </div>

      <!-- Details -->
      <div class="card">
        <h3>{{ 'products.details' | translate }}</h3>
        <div class="field-row">
          <app-input label="labels.type" [formGroup]="form" controlName="type" type="select" [options]="typeOptions" [translateOptions]="true" />
          <app-input label="labels.condition" [formGroup]="form" controlName="condition" type="select" [options]="conditionOptions" [translateOptions]="true" />
        </div>
        <div class="field-row">
          <app-input label="labels.city" [formGroup]="form" controlName="city" type="select" [options]="governorateOptions" [translateOptions]="true" />
          <app-input label="labels.location" [formGroup]="form" controlName="location" placeholder="placeholders.location" />
        </div>
        <div class="field-group mt-3">
          <label class="field-label">{{ 'labels.mapLocation' | translate }}</label>
          <app-map [formGroup]="form" latitudeControlName="lat" longitudeControlName="lng" [height]="300" [showActions]="true" />
        </div>
      </div>
    </div>

    <div class="column">
      <!-- Media -->
      <div class="card">
        <h3>{{ 'products.media' | translate }}</h3>
        <app-multi-image-uploader [images]="uploadedImages" (imagesChange)="uploadedImages = $event"/>
      </div>

      <div class="card">
        <h3>{{ 'products.organization' | translate }}</h3>
        <app-input label="labels.category" [formGroup]="form" controlName="categoryId" type="select" [options]="categories()" [required]="true" placeholder="placeholders.category" />
        <app-input class="m-2" label="labels.subcategory" [formGroup]="form" controlName="subcategoryId" type="select" [options]="subcategories()" [required]="true" placeholder="placeholders.subcategory" />
        <app-input label="labels.brand" [formGroup]="form" controlName="brandId" type="select" [options]="brands()" [required]="true" placeholder="placeholders.brand" />
      </div>
    </div>
  </form>

  <div class="flex gap-3 justify-content-end pt-3">
    <app-loading-button variant="stroked" (clicked)="cancel()" type="button">{{ 'buttons.cancel' | translate }}</app-loading-button>
    <app-loading-button color="primary" (clicked)="onSubmit()" [loading]="isSaving" [disabled]="form.invalid">{{ 'buttons.save' | translate }}</app-loading-button>
  </div>
</div>
