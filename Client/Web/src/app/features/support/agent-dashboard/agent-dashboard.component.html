<div class="agent-container">
  <h2>Support Agent Workspace</h2>
  <p class="text-muted">Resolve disputes and handle item damages here. Changes reflect immediately in user wallets.</p>

  <div *ngIf="errorMsg()" class="alert alert-error mb-3">{{ errorMsg() }}</div>
  <div *ngIf="successMsg()" class="alert alert-success mb-3">{{ successMsg() }}</div>

  <div class="dispute-form surface-card p-4 border-round shadow-1">
    <h3 class="mb-4">Dispute Resolution</h3>
    
    <div class="grid">
      <div class="col-12 md:col-6">
        <div class="form-group">
          <label class="block mb-2 font-medium">Rental ID</label>
          <input type="text" class="w-full p-2 border-round border-1 border-300"
                 [ngModel]="rentalId()" (ngModelChange)="rentalId.set($event)" 
                 placeholder="Enter Rental UUID" [disabled]="isLoading()" />
        </div>
      </div>

      <div class="col-12 md:col-6">
        <div class="form-group">
          <label class="block mb-2 font-medium">Resolution Action</label>
          <select class="w-full p-2 border-round border-1 border-300"
                  [ngModel]="resolutionType()" (ngModelChange)="resolutionType.set($event)" 
                  [disabled]="isLoading()">
            <option value="split_deposit">Split Deposit (Partial forfeit & partial refund)</option>
            <option value="forfeit_deposit">Forfeit Entire Deposit (To Owner)</option>
            <option value="refund_renter">Refund Entire Deposit (To Renter)</option>
          </select>
        </div>
      </div>

      <div class="col-12 md:col-6" *ngIf="resolutionType() === 'split_deposit' || resolutionType() === 'forfeit_deposit'">
        <div class="form-group">
          <label class="block mb-2 font-medium">Amount to Owner (Penalty for Renter)</label>
          <input type="number" class="w-full p-2 border-round border-1 border-300"
                 [ngModel]="ownerCompensation()" (ngModelChange)="ownerCompensation.set($event)" 
                 min="0" placeholder="EGP" [disabled]="isLoading()" />
        </div>
      </div>

      <div class="col-12 md:col-6" *ngIf="resolutionType() === 'split_deposit' || resolutionType() === 'refund_renter'">
        <div class="form-group">
          <label class="block mb-2 font-medium">Amount to Refund Renter</label>
          <input type="number" class="w-full p-2 border-round border-1 border-300"
                 [ngModel]="renterRefund()" (ngModelChange)="renterRefund.set($event)" 
                 min="0" placeholder="EGP" [disabled]="isLoading()" />
        </div>
      </div>

      <div class="col-12">
        <div class="form-group">
          <label class="block mb-2 font-medium">Internal Reason & Log</label>
          <textarea class="w-full p-2 border-round border-1 border-300"
                    [ngModel]="reason()" (ngModelChange)="reason.set($event)" 
                    placeholder="Explain the support decision..." [disabled]="isLoading()" rows="4"></textarea>
        </div>
      </div>

      <div class="col-12 flex justify-content-end mt-4">
        <button class="btn btn-primary px-5 py-2 border-round" (click)="resolveDispute()" 
                [disabled]="isLoading() || !rentalId() || !reason()">
          {{ isLoading() ? 'Processing...' : 'Execute Resolution' }}
        </button>
      </div>
    </div>
  </div>
</div>
