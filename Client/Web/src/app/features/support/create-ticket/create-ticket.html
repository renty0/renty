<div class="create-ticket-container">
  <app-header-section
    [title]="'support.openTicket' | translate"
    [showButton]="false"
    [showSearch]="false"
    icon="add_task">
    <div extra-actions>
      <button mat-stroked-button class="back-btn" routerLink="/chats">
        <mat-icon>arrow_back</mat-icon>
        {{ 'support.myTickets' | translate }}
      </button>
    </div>
  </app-header-section>
 
  <div class="create-ticket-content">
    <mat-card class="glass-card">
      <form (ngSubmit)="submit()">
        <div class="form-grid">
          <div class="field-wrapper">
            <h4 class="field-title">{{ 'support.type' | translate }}</h4>
            <mat-form-field appearance="outline" class="full-width">
              <mat-select [ngModel]="ticketType()" (ngModelChange)="ticketType.set($event)" name="type" required panelClass="support-select-panel">
                @for (t of types; track t.value) {
                  <mat-option [value]="t.value">{{ t.label | translate }}</mat-option>
                }
              </mat-select>
            </mat-form-field>
          </div>

          <div class="field-wrapper">
            <h4 class="field-title">{{ 'support.subject' | translate }}</h4>
            <mat-form-field appearance="outline" class="full-width">
              <input matInput
                     [ngModel]="subject()"
                     (ngModelChange)="subject.set($event)"
                     name="subject"
                     placeholder="{{ 'support.subjectPlaceholder' | translate }}"
                     required />
            </mat-form-field>
          </div>
 
          <div class="field-wrapper">
            <h4 class="field-title">{{ 'support.message' | translate }}</h4>
            <mat-form-field appearance="outline" class="full-width">
              <textarea matInput
                        rows="8"
                        [ngModel]="message()"
                        (ngModelChange)="message.set($event)"
                        name="message"
                        placeholder="{{ 'support.message_placeholder' | translate }}"
                        required></textarea>
            </mat-form-field>
          </div>
        </div>
 
        <div class="form-actions">
          <app-loading-button
            [matIcon]="'send'"
            [loading]="isSubmitting()"
            [disabled]="!message().trim() || !subject().trim()"
            [color]="'primary'"
            [variant]="'filled'"
            [size]="'lg'"
            (clicked)="submit()"
          >
            {{ 'support.create' | translate }}
          </app-loading-button>
        </div>
      </form>
    </mat-card>
  </div>
</div>
