<div class="create-ticket-container">
  <app-header-section
    [title]="'support.openTicket' | translate"
    [subtitle]="'support.ticket_info' | translate"
    icon="add_task">
    <div actions>
      <button mat-stroked-button color="primary" routerLink="/support">
        <mat-icon>arrow_back</mat-icon>
        {{ 'support.myTickets' | translate }}
      </button>
    </div>
  </app-header-section>

  <div class="create-ticket-content">
    <mat-card class="glass-card">
      <form (ngSubmit)="submit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>{{ 'support.type' | translate }}</mat-label>
          <mat-select [(ngModel)]="ticketType" name="type" required>
            @for (t of types; track t.value) {
              <mat-option [value]="t.value">{{ t.label | translate }}</mat-option>
            }
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>{{ 'support.message' | translate }}</mat-label>
          <textarea matInput
                    rows="8"
                    [(ngModel)]="message"
                    name="message"
                    placeholder="{{ 'support.message_placeholder' | translate }}"
                    required></textarea>
        </mat-form-field>

        <div class="form-actions">
          <button mat-flat-button
                  color="primary"
                  type="submit"
                  [disabled]="!message().trim() || isSubmitting()">
            <mat-icon>{{ isSubmitting() ? 'hourglass_top' : 'send' }}</mat-icon>
            {{ 'support.create' | translate }}
          </button>
        </div>
      </form>
    </mat-card>
  </div>
</div>
