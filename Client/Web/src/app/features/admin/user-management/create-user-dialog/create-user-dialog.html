<h2 mat-dialog-title>{{ 'admin.userManagement.addUser' | translate }}</h2>

<mat-dialog-content>
    <form [formGroup]="userForm" class="grid">

        <app-input [formGroup]="userForm" class="col-12 md:col-6" controlName="firstName" label="common.FirstName" [required]="true" />

        <app-input [formGroup]="userForm" class="col-12 md:col-6" controlName="lastName" label="common.LastName" [required]="true" />
        <app-input [formGroup]="userForm" class="col-12" controlName="roles" type="multiselect" label="admin.roleManagement.roles"
            [options]="roleOptions" [required]="true" />

        <app-input [formGroup]="userForm" class="col-12 " controlName="email" label="email" [required]="true" />

        <app-input [formGroup]="userForm" class="col-12" controlName="password" type="password" label="password"
            [required]="true" />


    </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>{{ 'common.cancel' | translate }}</button>
    <app-loading-button color="primary" [loading]="isSaving()" [disabled]="userForm.invalid" (clicked)="save()">
        <mat-icon>person_add</mat-icon>
        {{ 'common.Save' | translate }}
    </app-loading-button>
</mat-dialog-actions>
