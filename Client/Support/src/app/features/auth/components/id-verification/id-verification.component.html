<div class="auth-container">
  <div class="auth-box">
    <h2>ID Verification</h2>
    <p>Please upload a clear picture of your National ID (Front and Back) to verify your account.</p>

    @if (errorMsg()) { <div class="alert alert-error">{{ errorMsg() }}</div> }
    @if (successMsg()) { <div class="alert alert-success">{{ successMsg() }}</div> }

    <div class="form-group">
      <label>National ID - Front</label>
      <input type="file" accept="image/*" (change)="onFileSelected($event, 'front')" [disabled]="isLoading()" />
      @if (frontImage()) { <img [src]="frontImage()" class="preview-img" alt="Front Preview" /> }
    </div>

    <div class="form-group mt-3">
      <label>National ID - Back</label>
      <input type="file" accept="image/*" (change)="onFileSelected($event, 'back')" [disabled]="isLoading()" />
      @if (backImage()) { <img [src]="backImage()" class="preview-img" alt="Back Preview" /> }
    </div>

    <button class="btn btn-primary mt-3" 
      (click)="submitDocument()" 
      [disabled]="isLoading() || !frontImage() || !backImage()">
      {{ isLoading() ? 'Submitting...' : 'Submit for Review' }}
    </button>
  </div>
</div>
