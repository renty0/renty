<div class="modal-backdrop" (click)="onClose()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <button class="close-btn" (click)="onClose()">&times;</button>
    <h2>Report Inappropriate Content</h2>
    <p>Reporting: <strong>{{ itemTitle }}</strong></p>

    <div *ngIf="successMsg()" class="alert alert-success">{{ successMsg() }}</div>
    <div *ngIf="errorMsg()" class="alert alert-error">{{ errorMsg() }}</div>

    <div class="form-group mt-3">
      <label>What's wrong with this item?</label>
      <select [(ngModel)]="reason" [disabled]="isSubmitting()">
        <option value="" disabled selected>Select a reason...</option>
        <option value="scam">Scam / Fraudulent listing</option>
        <option value="prohibited">Prohibited / Illegal item</option>
        <option value="fake">Fake / Counterfeit</option>
        <option value="inappropriate">Inappropriate images or text</option>
      </select>
    </div>

    <div class="form-group mt-3">
      <label>Additional Notes (Optional)</label>
      <textarea [(ngModel)]="notes" rows="4" placeholder="Provide more context..." [disabled]="isSubmitting()"></textarea>
    </div>

    <div class="actions mt-4">
      <button class="btn btn-secondary" (click)="onClose()" [disabled]="isSubmitting()">Cancel</button>
      <button class="btn btn-danger" (click)="reportItem()" [disabled]="isSubmitting() || !reason()">
        {{ isSubmitting() ? 'Submitting...' : 'Submit Report' }}
      </button>
    </div>
  </div>
</div>
