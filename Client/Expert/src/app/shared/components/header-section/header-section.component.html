<header class="header-section">
  <div class="header-left">
    <h1 class="page-title">{{ title }}</h1>
    <div class="search-container" *ngIf="showSearch">
      <mat-icon class="search-icon">search</mat-icon>
      @if (showSearch) {
        <input type="text" class="search-input" [placeholder]="placeholder" [(ngModel)]="searchTerm" (input)="onInputChange($event)" />
      }
    </div>
  </div>
  <div class="header-actions">
    <ng-content select="[extra-actions]"></ng-content>
    @if (canShowButton) {
      @if (buttonLink) {
        <a [routerLink]="buttonLink">
          <app-loading-button color="primary">
            <mat-icon>{{ icon }}</mat-icon>
            {{ buttonText }}
          </app-loading-button>
        </a>
      } @else {
        <app-loading-button color="primary" (clicked)="onButtonClick()">
          <mat-icon>{{ icon }}</mat-icon>
          {{ buttonText }}
        </app-loading-button>
      }
    }
  </div>
</header>
