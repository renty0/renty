<div class="editor-wrapper">
  @if (isLoadingCategories() || isLoading() || isSaving()) {
    <div class="loading-overlay">
      <div class="spinner"></div>
    </div>
  }

  <form [formGroup]="form" class="category-form" (submit)="submit()">
    <div class="grid">
      <app-input class="col-12" label="nameEn" [formGroup]="form" controlName="nameEn" [required]="true" />
      <app-input class="col-12" label="nameAr" [formGroup]="form" controlName="nameAr" [required]="true" />
      <app-input class="col-12" label="descEn" type="textarea" [formGroup]="form" controlName="descEn" />
      <app-input class="col-12" label="descAr" type="textarea" [formGroup]="form" controlName="descAr" />
      <app-input class="col-12" label="parentCategory" type="select" [formGroup]="form" controlName="categoryId" [options]="categoryOptions()" [required]="true" />
      
      <div class="logo-section col-12">
        <span class="label">{{ 'labels.logo' | translate }}</span>
        <app-image-uploader #logoUploader [uploadPath]="'subcategories/logos'" [allowedExtensions]="['.jpg', '.jpeg', '.png', '.webp']"/>
      </div>
    </div>

    <div class="form-actions">
      <app-loading-button variant="stroked" (clicked)="cancelled.emit()" type="button" class="btn-cancel" [title]="'buttons.cancel' | translate">
        {{ 'buttons.cancel' | translate }}
      </app-loading-button>
      <app-loading-button color="primary" type="submit" [loading]="isSaving()" [disabled]="form.invalid" class="btn-submit" [title]="'buttons.save' | translate">
        {{ 'buttons.save' | translate }}
      </app-loading-button>
    </div>
  </form>
</div>
